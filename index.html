<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="SalonFinder — trouvez les salons de coiffure autour de vous.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>SalonFinder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#667085;--green:#087f3d;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:1000;background:#111827;color:#fff;padding:14px 16px}h1{margin:0;font-size:22px}.sub{font-size:13px;opacity:.7}
main{max-width:1200px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,select{border:0;border-radius:13px;padding:11px 13px;font:inherit;background:#fff;box-shadow:0 1px 5px #0001}button{cursor:pointer}.primary{background:#111827;color:#fff}
.status{padding:11px 13px;background:#fff;border-radius:13px;margin-bottom:12px;font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.85fr);gap:12px}
#map{height:67vh;min-height:430px;border-radius:20px;overflow:hidden;box-shadow:0 1px 5px #0001}.list{display:grid;gap:10px;align-content:start;max-height:67vh;overflow:auto}
.card{background:#fff;border-radius:17px;padding:14px;box-shadow:0 1px 6px #0000000d}.card h3{margin:0 0 5px;font-size:17px}
.meta{font-size:13px;color:var(--muted);line-height:1.55}.open{color:var(--green);font-weight:750}.closed{color:var(--red);font-weight:750}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions a,.actions button{padding:8px 10px;border-radius:10px;text-decoration:none;font-size:13px}
.actions a{background:#eef2ff;color:#27306b}.detailsBtn{background:#111827;color:#fff;border:0}
.details{position:fixed;inset:auto 0 0 0;background:#fff;border-radius:24px 24px 0 0;padding:18px;max-height:80vh;overflow:auto;box-shadow:0 -8px 35px #0003;z-index:2000;display:none}.details.show{display:block}
#map:fullscreen{width:100vw;height:100vh;border-radius:0}
.close{float:right;background:#f2f4f7}.details h2{margin:0 40px 5px 0}.hours{padding-left:20px}.notice{padding:10px 12px;background:#f8fafc;border-radius:12px;margin:10px 0}.empty{padding:25px;text-align:center;color:var(--muted);background:#fff;border-radius:16px}
@media(max-width:850px){.layout{grid-template-columns:1fr}#map{height:43vh;min-height:280px}.list{max-height:none}}
</style>
</head>
<body>
<header><h1>✂️ SalonFinder</h1><div class="sub">Salons de coiffure autour de vous</div></header>
<main>
<div class="toolbar">
<button id="locate" class="primary">📍 Utiliser ma position</button>
<select id="radius"><option value="100">100 m</option><option value="300">300 m</option><option value="500">500 m</option><option value="1000">1 km</option><option value="3000" selected>3 km</option><option value="5000">5 km</option><option value="10000">10 km</option></select><button id="fullscreen">🗺️ Plein écran</button>
<select id="filter"><option value="all">Tous les salons</option><option value="open">🟢 Ouverts maintenant</option></select>
<select id="sort"><option value="distance">📍 Plus proches</option><option value="name">🔤 Nom</option></select>
</div>
<div id="status" class="status">Clique sur « Utiliser ma position » pour rechercher les salons proches.</div>
<div class="layout"><div id="map"></div><div id="list"></div></div>
</main>
<section id="details" class="details"><button id="closeDetails" class="close">✕</button><div id="detailsContent"></div></section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
let map, userMarker, userPos, places=[], markers=[];
const OVERPASS_ENDPOINTS=[
 "https://overpass-api.de/api/interpreter",
 "https://overpass.kumi.systems/api/interpreter"
];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function status(x){document.getElementById("status").innerHTML=x}
function dist(a,b){const R=6371000,p=Math.PI/180,dLat=(b.lat-a.lat)*p,dLon=(b.lng-a.lng)*p,x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function fmt(m){return m<1000?Math.round(m)+" m":(m/1000).toFixed(1)+" km"}
function parseHours(h){if(!h)return null;
  const now=new Date(), day=["Su","Mo","Tu","We","Th","Fr","Sa"][now.getDay()], mins=now.getHours()*60+now.getMinutes();
  const parts=h.split(";").map(x=>x.trim());
  let today=parts.find(x=>new RegExp("^"+day+"(?:-|\\s|$)","i").test(x));
  if(!today && /^[0-9]{1,2}:[0-9]{2}/.test(h)) today=h;
  if(!today)return null;
  let s=today.replace(/^[A-Za-z]{2}(?:-[A-Za-z]{2})?\\s*/,"").trim();
  if(/off|closed/i.test(s))return false;
  const ranges=s.match(/(\\d{1,2}):?(\\d{2})?\\s*[-–]\\s*(\\d{1,2}):?(\\d{2})?/g);
  if(!ranges)return null;
  return ranges.some(r=>{const n=r.match(/(\\d{1,2}):?(\\d{2})?\\s*[-–]\\s*(\\d{1,2}):?(\\d{2})?/);let a=+n[1]*60+(+(n[2]||0)),b=+n[3]*60+(+(n[4]||0));return b<a?mins>=a||mins<b:mins>=a&&mins<b});
}
function hoursLines(h){if(!h)return [];return h.split(";").map(x=>x.trim()).filter(Boolean)}
function osmUrl(p){return `https://www.openstreetmap.org/${p.type}/${p.id}`}
function routeUrl(p){return `https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${userPos.lat},${userPos.lng};${p.lat},${p.lon}`}
function clear(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function toggleFullscreen(){const el=document.getElementById("map"); if(!document.fullscreenElement){el.requestFullscreen?.()}else{document.exitFullscreen?.()} setTimeout(()=>map.invalidateSize(),500);}
async function init(){
 map=L.map("map").setView([48.8566,2.3522],13);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
 document.getElementById("locate").onclick=locate;
 document.getElementById("fullscreen").onclick=toggleFullscreen;
 document.getElementById("radius").onchange=()=>userPos&&search();
 document.getElementById("filter").onchange=render;
 document.getElementById("sort").onchange=render;
 document.getElementById("closeDetails").onclick=()=>document.getElementById("details").classList.remove("show");
}
function locate(){
 if(!navigator.geolocation)return status("❌ La géolocalisation n'est pas disponible.");
 status("📍 Demande d'autorisation de localisation…");
 navigator.geolocation.getCurrentPosition(async p=>{
   userPos={lat:p.coords.latitude,lng:p.coords.longitude};
   map.setView([userPos.lat,userPos.lng],15);
   if(userMarker)map.removeLayer(userMarker);
   userMarker=L.marker([userPos.lat,userPos.lng]).addTo(map).bindPopup("Votre position");
   await search();
 },()=>status("❌ Localisation refusée. Autorise la localisation puis réessaie."),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
async function search(){
 clear();places=[];
 const r=Number(document.getElementById("radius").value);
 status("🔎 Recherche des salons dans OpenStreetMap…");
 const q=`[out:json][timeout:25];(nwr["shop"="hairdresser"](around:${r},${userPos.lat},${userPos.lng});nwr["shop"="barber"](around:${r},${userPos.lat},${userPos.lng}););out center tags;`;
 let data=null;
 for(const endpoint of OVERPASS_ENDPOINTS){
   try{const res=await fetch(endpoint,{method:"POST",body:q,headers:{"Content-Type":"text/plain"}});if(!res.ok)continue;data=await res.json();break}catch(e){}
 }
 if(!data){status("❌ Le service OpenStreetMap/Overpass est momentanément indisponible.");return}
 places=(data.elements||[]).map(e=>{
   const lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon,t=e.tags||{};
   return {...e,lat,lon,tags:t,distance:dist(userPos,{lat,lng:lon})};
 }).filter(p=>p.lat!=null&&p.lon!=null).sort((a,b)=>a.distance-b.distance);
 render();
 if(markers.length){map.fitBounds(L.featureGroup(markers).getBounds().pad(0.15));}
 status(`✅ ${places.length} salon(s) trouvé(s) dans un rayon de ${r<1000?r+" m":r/1000+" km"}. Tous les salons sont affichés sur la carte.`);
}
function render(){
 clear();
 const mode=document.getElementById("filter").value,sort=document.getElementById("sort").value;
 let arr=places.filter(p=>mode!=="open"||parseHours(p.tags.opening_hours)===true);
 arr.sort(sort==="name"?(a,b)=>(a.tags.name||"").localeCompare(b.tags.name||""):((a,b)=>a.distance-b.distance));
 const list=document.getElementById("list");list.innerHTML="";
 if(!arr.length){list.innerHTML='<div class="empty">Aucun salon ne correspond au filtre dans ce rayon.</div>';return}
 arr.forEach(p=>{
   const open=parseHours(p.tags.opening_hours), name=p.tags.name||"Salon de coiffure";
   const marker=L.marker([p.lat,p.lon]).addTo(map).bindPopup(`<b>${esc(name)}</b><br>${esc(p.tags["addr:street"]||"")}`);
   marker.on("click",()=>show(p));markers.push(marker);
   const addr=[p.tags["addr:housenumber"],p.tags["addr:street"],p.tags["addr:postcode"],p.tags["addr:city"]].filter(Boolean).join(" ");
   const card=document.createElement("article");card.className="card";
   card.innerHTML=`<h3>${esc(name)}</h3><div class="meta"><span class="${open===true?"open":open===false?"closed":""}">${open===true?"● Ouvert maintenant":open===false?"● Fermé maintenant":"● Horaires inconnus"}</span><br>${esc(addr||"Adresse non renseignée")}<br>${fmt(p.distance)}</div><div class="actions"><button class="detailsBtn">Voir les détails</button><a target="_blank" rel="noopener" href="${routeUrl(p)}">🧭 GPS</a></div>`;
   card.querySelector("button").onclick=()=>show(p);list.appendChild(card);
 });
}
function show(p){
 const t=p.tags,open=parseHours(t.opening_hours),name=t.name||"Salon de coiffure";
 const addr=[t["addr:housenumber"],t["addr:street"],t["addr:postcode"],t["addr:city"]].filter(Boolean).join(" ");
 const website=t.website||t["contact:website"];
 document.getElementById("detailsContent").innerHTML=`<h2>${esc(name)}</h2><div class="meta">${esc(addr||"Adresse non renseignée")}<br><b class="${open===true?"open":open===false?"closed":""}">${open===true?"Ouvert maintenant":open===false?"Fermé maintenant":"Horaires non déterminés"}</b> · ${fmt(p.distance)}</div>
 <div class="actions"><a target="_blank" rel="noopener" href="${routeUrl(p)}">🧭 Itinéraire</a>${website?`<a target="_blank" rel="noopener" href="${esc(website)}">🌐 Site</a>`:""}<a target="_blank" rel="noopener" href="${osmUrl(p)}">OpenStreetMap</a></div>
 <h3>Horaires</h3>${t.opening_hours?`<ul class="hours">${hoursLines(t.opening_hours).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<div class='notice'>Les horaires ne sont pas renseignés dans OpenStreetMap pour ce salon.</div>"}
 <h3>Avis</h3><div class="notice">OpenStreetMap ne fournit pas de système d'avis/notes comparable aux avis Google. Cette version n'invente donc pas de note. Si le salon possède un site ou un lien externe renseigné dans ses données, il est affiché ci-dessus.</div>
 <p class="meta">Données cartographiques : OpenStreetMap. Les informations dépendent de ce qui a été renseigné par les contributeurs.</p>`;
 document.getElementById("details").classList.add("show");
}
init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
